# Tidy URLs: /index.html and /blog/index.html are the canonical forms used in the sitemap and canonicals, so no extra redirect is needed.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
