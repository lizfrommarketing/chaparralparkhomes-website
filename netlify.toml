# Netlify config for the Chaparral Park Homes site (canonical host: https://chaparralparkhomes.com)
# Every page also carries <link rel="canonical"> and og:url pointing at https://chaparralparkhomes.com/...
# The redirects below make sure only that one host is ever served, so the other addresses can't create duplicate content.

# www -> apex (add the www domain in Netlify > Domain management so these rules can fire)
[[redirects]]
  from = "https://www.chaparralparkhomes.com/*"
  to = "https://chaparralparkhomes.com/:splat"
  status = 301
  force = true

# http -> https on the apex
[[redirects]]
  from = "http://chaparralparkhomes.com/*"
  to = "https://chaparralparkhomes.com/:splat"
  status = 301
  force = true

# Netlify's default *.netlify.app address -> real domain (replace SITE-NAME with the Netlify site name, or remove if you disable the netlify.app URL)
# [[redirects]]
#   from = "https://SITE-NAME.netlify.app/*"
#   to = "https://chaparralparkhomes.com/:splat"
#   status = 301
#   force = true

# Old-site blog URLs had no .html. The canonical/sitemap URLs for blog posts are the .html files, so
# /blog/<slug> 301s to /blog/<slug>.html (same slugs as the old chaparralparkhomes.com blog) and old links keep working.
# Plain 301s only apply when no file exists at the extensionless path, so these never loop with the .html files.
[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 301

# The two posts that were already ported under shorter file names: old-site slug -> new file
[[redirects]]
